version: "3.8"

# Geopolitical Sentinel — Full Automation Stack
# Usage: docker-compose up -d
#
# Services:
#   yt-machine  — Pipeline API (generate + publish videos)
#   n8n         — Workflow automation (daily triggers, notifications)

services:
  yt-machine:
    build: .
    container_name: yt-machine
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist generated videos and credentials across restarts
      - ./output:/app/output
      - ./credentials:/app/credentials
      # Cache Ollama models if using local LLM
      - ~/.ollama:/root/.ollama
    networks:
      - sentinel-net
    # Optional: limit resources for long-running generation
    deploy:
      resources:
        limits:
          memory: 4G
    # ── Phase 1: PostgreSQL dependency ──
    # WHY depends_on? Docker Compose starts services in dependency order.
    # Without this, yt-machine could start before PostgreSQL is ready,
    # causing "connection refused" errors. The condition: service_healthy
    # waits until PostgreSQL actually responds to connections, not just
    # "the container started."
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      # Timezone for cron schedules
      - GENERIC_TIMEZONE=${TZ:-Europe/London}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sentinel-net
    depends_on:
      - yt-machine

  # ── Phase 1: PostgreSQL Database ──
  # WHY A SEPARATE CONTAINER? Your old system used JSON files for storage.
  # PostgreSQL runs in its own container with its own volume — this means:
  # 1. Data survives container rebuilds (pgdata volume is persistent)
  # 2. Database can be scaled/backed up independently
  # 3. Multiple yt-machine instances can share one database
  # The pgvector extension adds vector similarity search (Phase 5).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yt-machine-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yt_machine}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-yt_machine}
    volumes:
      # pgdata volume persists the database across docker-compose down/up
      - pgdata:/var/lib/postgresql/data
    networks:
      - sentinel-net
    # healthcheck: Docker uses this to know when PostgreSQL is ready.
    # pg_isready returns 0 only when the database accepts connections.
    # This prevents yt-machine from trying to connect too early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yt_machine}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Ollama for local LLM fallback
  # Uncomment if you want Ollama running in Docker
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - sentinel-net
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

volumes:
  n8n_data:
    driver: local
  # ── Phase 1: PostgreSQL persistent storage ──
  # WHY A NAMED VOLUME? Docker named volumes survive `docker-compose down`.
  # If you used a bind mount (./data:/var/lib/postgresql/data), you'd risk
  # file permission issues. Named volumes are managed by Docker and have
  # correct permissions automatically.
  pgdata:
    driver: local
  # ollama_data:
  #   driver: local

networks:
  sentinel-net:
    driver: bridge