# Geopolitical Sentinel — Full Automation Stack
# Usage (from repo root): docker compose -f infra/docker-compose.yml up -d
#
# Services:
#   yt-machine  — Pipeline API (generate + publish videos)  → :8000
#   postgres    — PostgreSQL 16 + pgvector                  → :5432
#   n8n         — Workflow automation                       → :5678

services:
  yt-machine:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: yt-machine
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Inside the compose network the database is the `postgres` service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # Reach the host-side LLM bridge (MLX/Ollama) from inside the container.
      # Requires tools/start_llm.sh with MLX_BIND=0.0.0.0 (or host Ollama).
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../output:/app/output
      - ../credentials:/app/credentials
      - ../assets:/app/assets:ro
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          memory: 4G
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=${TZ:-Europe/London}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sentinel-net
    depends_on:
      - yt-machine

  postgres:
    image: pgvector/pgvector:pg16
    container_name: yt-machine-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yt_machine}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
    driver: local
  pgdata:
    driver: local

networks:
  sentinel-net:
    driver: bridge
